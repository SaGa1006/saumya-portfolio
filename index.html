<!doctype html>
<html lang="en" class="is-loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saumya Garg · UX & Product Designer</title>
  <meta name="description" content="Portfolio of Saumya Garg, UX and product designer.">
  <meta name="theme-color" content="#fcfde8">
  <link rel="preload" href="assets/sun-sprite.webp" as="image" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
  <link rel="stylesheet" href="css/loader.css">
  <style>
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--paper); color: var(--ink); font-family: var(--f-serif); }
    html.is-loading body { overflow: hidden; }
    .hero {
      min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center; text-align: center;
      padding: 32px 16px; box-sizing: border-box;
    }
    .hero h1 { font-weight: 500; font-style: normal; font-size: clamp(36px, 6.4vw, 76px); line-height: 1.1; text-wrap: balance; margin: 0; }
    .hero .star { color: var(--wash); font-size: .7em; vertical-align: .2em; margin: 0 .1em; }
    .hero p { font-size: clamp(18px, 2.4vw, 24px); color: var(--ink-soft); margin: 16px 0 0; }
    .hero .connect { margin-top: 28px; font-size: clamp(17px, 2vw, 20px); }
    .cta {
      display: inline-flex; align-items: center; gap: .4em; margin-top: 14px;
      font: 500 20px/1 var(--f-serif); color: var(--ink); text-decoration: none;
      padding: 14px 28px; border: 1px solid var(--ink); border-radius: 999px;
      transition: background-color .25s ease, color .25s ease;
    }
    .cta:hover { background: var(--ink); color: var(--paper); }
    .cta:focus-visible { outline: 2px solid var(--wash); outline-offset: 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .hero > div { opacity: 0; transform: translateY(8px); transition: opacity .8s ease .1s, transform .8s ease .1s; }
    html:not(.is-loading) .hero > div { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { .hero > div { transition: none; } }
  </style>
</head>
<body>
  <div id="sun-loader" class="sun-loader" role="progressbar" aria-label="Loading Saumya's portfolio"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="sun-loader__inner">
      <div class="sun-loader__art"></div>
      <div class="sun-loader__pct">0<small>%</small></div>
    </div>
  </div>

  <main class="hero">
    <div>
      <h1>Howdy, I'm SaGa (Saumya Garg) <span class="star" aria-hidden="true">&#10022;</span></h1>
      <p>Product Designer. Portfolio coming soon.</p>
      <p class="connect">In the meantime, you can connect with me.</p>
      <a class="cta" href="https://www.linkedin.com/in/saumya-garg-35461b1b8/" target="_blank" rel="noopener noreferrer">Get in touch <span aria-hidden="true">&#8599;</span><span class="sr-only"> on LinkedIn (opens in a new tab)</span></a>
    </div>
  </main>

  <noscript><style>.sun-loader{display:none}html.is-loading body{overflow:auto}.hero>div{opacity:1;transform:none}</style></noscript>
  <script src="js/loader.js"></script>
</body>
</html>
